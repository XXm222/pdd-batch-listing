<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
  <title id="title">商品运营台 · Goods Workspace</title>
  <desc id="desc">从 Excel 到拼多多商品草稿。右侧图形将商品表格、立体包裹和草稿核对连在一起。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#11192b"/>
      <stop offset="1" stop-color="#0b1624"/>
    </linearGradient>
    <radialGradient id="light" cx=".77" cy=".53" r=".43">
      <stop stop-color="#126e70" stop-opacity=".44"/>
      <stop offset="1" stop-color="#0b1624" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#369cb0"/>
      <stop offset=".52" stop-color="#73e7c5"/>
      <stop offset="1" stop-color="#c0ffe1"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
