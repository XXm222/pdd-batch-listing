      <stop offset="1" stop-color="#12253a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#aac8eb" opacity=".35"/>
    </pattern>
    <clipPath id="frame"><rect width="1440" height="410" rx="25"/></clipPath>
  </defs>

