location = /goods-updates/latest.json {
    alias /srv/goods-workspace-updates/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/mandla-security-headers.conf;
    limit_except GET HEAD { deny all; }
}
location ^~ /goods-updates/releases/ {
    alias /srv/goods-workspace-updates/releases/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/mandla-security-headers.conf;
    limit_except GET HEAD { deny all; }
}
location = /goods-updates/mac-arm64.dmg {
    alias /srv/goods-workspace-updates/latest-mac-arm64.dmg;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/mandla-security-headers.conf;
    limit_except GET HEAD { deny all; }
}
location = /goods-updates/windows-x64.exe {
    alias /srv/goods-workspace-updates/latest-win32-x64.exe;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/mandla-security-headers.conf;
    limit_except GET HEAD { deny all; }
}
